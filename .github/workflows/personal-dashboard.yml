name: Personal Dashboard Gate

on:
  push:
    branches:
      - feat/steam-style-dashboard
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fast-gate:
    name: Fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply frontend lint autofixes
        run: npm run lint

      - name: Commit dashboard formatter fix
        if: github.event_name == 'push' && github.ref_name == 'feat/steam-style-dashboard'
        run: |
          if ! git diff --quiet -- src/views/LibraryHome.vue; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/views/LibraryHome.vue
            git commit -m "style: format software library view"
            git push origin HEAD:feat/steam-style-dashboard
          fi

      - name: Build production WebUI
        run: npm run build

      - name: Upload personal WebUI build
        uses: actions/upload-artifact@v4
        with:
          name: activitywatch-personal-webui
          path: dist/
          if-no-files-found: error
          retention-days: 14
